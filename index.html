<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Frontend Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__left">
        <button class="icon-btn" id="menuToggle" aria-label="Toggle menu">☰</button>
        <div class="brand">
          <span class="brand__logo">▶</span>
          <span class="brand__text">YouTube</span>
        </div>
      </div>
      <div class="topbar__center">
        <div class="searchbar">
          <input id="searchInput" type="text" placeholder="Search" />
          <button id="searchBtn" aria-label="Search">🔍</button>
        </div>
      </div>
      <div class="topbar__right">
        <button class="icon-btn" aria-label="Create">＋</button>
        <button class="icon-btn" aria-label="Notifications">🔔</button>
        <div class="avatar">U</div>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" id="sidebar">
        <button class="sidebar__item active">Home</button>
        <button class="sidebar__item">Shorts</button>
        <button class="sidebar__item">Subscriptions</button>
        <hr />
        <button class="sidebar__item">Library</button>
        <button class="sidebar__item">History</button>
        <button class="sidebar__item">Your videos</button>
      </aside>

      <section class="content">
        <div class="chips" id="chips"></div>
        <div class="video-grid" id="videoGrid"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
